# 独立站点：使用 pay.example.com 的 Let's Encrypt 证书。
server {
    listen 80;
    server_name pay.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parkfee-acme;
        default_type text/plain;
    }

    # 微信公众平台在 HTTP 根路径校验网页授权 / JS 接口安全域名。
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/parkfee-wechat;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pay.example.com;

    ssl_certificate /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/parkfee-wechat;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
